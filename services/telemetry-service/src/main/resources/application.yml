server:
  port: 8082

spring:
  application:
    name: telemetry-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/fleetpulse
    username: ${DB_USER:fleetpulse}
    password: ${DB_PASSWORD:fleetpulse}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
