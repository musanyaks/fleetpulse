<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sign in · FleetPulse</title>
<style>
:root{--blue:#2563eb;--blue2:#3b82f6;--green:#10b981;--red:#ef4444;--navy:#0d2b57;--line:#e6eaf2;--text:#1e293b;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;font:14px/1.5 "Segoe UI",system-ui,sans-serif;
     background:linear-gradient(135deg,#0d2b57 0%,#123a75 55%,#1e4a94 100%)}
.card{width:360px;background:#fff;border-radius:16px;padding:32px 30px;box-shadow:0 24px 64px rgba(2,6,23,.45)}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;color:var(--navy);justify-content:center}
.logo .sq{width:34px;height:34px;border-radius:9px;background:var(--blue2);display:grid;place-items:center;font-size:17px}
h1{font-size:17px;text-align:center;margin:16px 0 2px}
.sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:18px}
.banner{border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;display:none}
.banner.error{display:block;background:#fee2e2;color:#991b1b}
.banner.ok{display:block;background:#d1fae5;color:#065f46}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
input:focus{outline:2px solid var(--blue2);border-color:transparent}
button{width:100%;margin-top:18px;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700;
       background:var(--blue);color:#fff;cursor:pointer}
button:hover{filter:brightness(1.08)}
.demo{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-size:11.5px;color:var(--muted)}
.demo b{color:var(--text)}
.demo .row{display:flex;justify-content:space-between;padding:3px 0}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="sq">🛰️</span> FleetPulse</div>
  <h1>Sign in</h1>
  <p class="sub">Real-time fleet operations platform</p>
  <div class="banner error" id="err">Wrong username or password — try again.</div>
  <div class="banner ok" id="out">You have been signed out.</div>
  <form method="post" action="/login">
    <label>Username</label><input name="username" required autofocus autocomplete="username"/>
    <label>Password</label><input name="password" type="password" required autocomplete="current-password"/>
    <button>Sign in</button>
  </form>
  <div class="demo">
    <div class="row"><span>Demo accounts</span><span>password</span></div>
    <div class="row"><b>admin</b><span>admin123</span></div>
    <div class="row"><b>manager</b><span>manager123</span></div>
    <div class="row"><b>analyst</b><span>analyst123</span></div>
  </div>
</div>
<script>
const p = new URLSearchParams(location.search);
if(p.has('error')) document.getElementById('err').style.display = 'block';
if(p.has('loggedOut')) document.getElementById('out').style.display = 'block';
</script>
</body>
</html>
