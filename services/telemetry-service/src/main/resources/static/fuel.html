<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fuel · FleetPulse</title><link rel="stylesheet" href="/css/app.css"/></head>
<body data-page="fuel">
<div id="sidebar"></div>
<main>
  <div class="pagehead"><h1>Fuel Analytics</h1></div>
  <div class="banner">Percent-level fuel from tank sensors. km/L efficiency needs refill events + tank capacity — fuel-service module on the roadmap.</div>
  <div class="cards grid4" id="stats"></div>
  <div class="card"><h3>Fleet Average — live (session)</h3><div class="pad">
    <svg viewBox="0 0 300 70" width="100%" height="70" preserveAspectRatio="none">
      <path id="spark" fill="none" stroke="#2563eb" stroke-width="2"/></svg></div></div>
  <div class="card"><h3>Vehicles by Fuel Level (lowest first)</h3>
    <div class="tblwrap"><table><thead><tr><th>Plate</th><th>Status</th><th>Fuel</th><th>Speed</th><th>Fuel trend per minute</th></tr></thead>
    <tbody id="rows"></tbody></table></div></div>
</main>
<script src="/js/app.js"></script>
<script>
const U=window.FleetUI; let samples=[], prev=new Map();
async function load(){
  try{
    const lv=await U.api('/api/v1/vehicles/live');
    const fuels=lv.map(v=>v.fuelLevelPct).filter(x=>x!=null);
    const avg=fuels.length?fuels.reduce((a,b)=>a+b,0)/fuels.length:null;
    const low=lv.filter(v=>v.fuelLevelPct!=null&&v.fuelLevelPct<15).length;
    const mid=lv.filter(v=>v.fuelLevelPct!=null&&v.fuelLevelPct>=15&&v.fuelLevelPct<35).length;
    document.getElementById('stats').innerHTML=[
      ['Fleet Avg Fuel',avg==null?'–':avg.toFixed(1)+'%'],['Vehicles <15%',low],['Vehicles <35%',mid],['Reporting',lv.length]
    ].map(([l,v])=>`<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');
    if(avg!=null){samples.push(avg);if(samples.length>60)samples.shift();
      const min=Math.min(...samples),max=Math.max(...samples),rng=(max-min)||1;
      document.getElementById('spark').setAttribute('d',samples.map((s,i)=>{
        const x=i/(samples.length-1||1)*300,y=62-(s-min)/rng*54+4;
        return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join(''));}
    document.getElementById('rows').innerHTML=lv.filter(v=>v.fuelLevelPct!=null)
      .sort((a,b)=>a.fuelLevelPct-b.fuelLevelPct).map(v=>{
        const f=v.fuelLevelPct, col=f<15?'var(--red)':f<35?'var(--amber)':'var(--green)';
        const rate=prev.has(v.vehicleId)?(f-prev.get(v.vehicleId)).toFixed(2):'–';
        prev.set(v.vehicleId,f);
        return `<tr><td><b>${U.fmtPlate(v.vehicleId)}</b></td>
          <td>${v.status}</td>
          <td><span class="fring" style="--p:${f.toFixed(0)};--c:${col}"><div>${f.toFixed(0)}%</div></span></td>
          <td>${U.fmt(v.speedKph)} km/h</td>
          <td class="muted">${rate} %/2s</td></tr>`;}).join('')||'<tr><td colspan="5" class="muted">Waiting for telemetry…</td></tr>';
  }catch(e){}
}
load(); setInterval(load,2000);
</script></body></html>
